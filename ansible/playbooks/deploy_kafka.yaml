---
- name: Deploy 3-broker Kafka with ISR via Strimzi
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kubeconfig_dir: "{{ playbook_dir | dirname }}/kubeconfig"
    kubeconfig_path: "{{ query('ansible.builtin.fileglob', kubeconfig_dir + '/*.yaml') | first }}"

  tasks:
    - name: Define the Kafka broker node pool (3 brokers, ephemeral, spread across kafka nodes)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: kafka
            labels:
              strimzi.io/cluster: market-data
          spec:
            replicas: 3
            roles:
              - controller
              - broker
            storage:
              type: ephemeral
            resources:
              requests:
                memory: 1Gi
                cpu: 250m
              limits:
                memory: 2Gi
            template:
              pod:
                tolerations:
                  - key: role
                    operator: Equal
                    value: kafka
                    effect: NoSchedule
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: role
                              operator: In
                              values:
                                - kafka
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            strimzi.io/pool-name: brokers
                        topologyKey: kubernetes.io/hostname

    - name: Define the Kafka cluster (KRaft, 3-broker ISR, Strimzi-managed PDB)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: Kafka
          metadata:
            name: market-data
            namespace: kafka
            annotations:
              strimzi.io/node-pools: enabled
              strimzi.io/kraft: enabled
          spec:
            kafka:
              listeners:
                - name: plain
                  port: 9092
                  type: internal
                  tls: false
              config:
                offsets.topic.replication.factor: 3
                transaction.state.log.replication.factor: 3
                transaction.state.log.min.isr: 2
                default.replication.factor: 3
                min.insync.replicas: 2
            entityOperator:
              topicOperator: {}
              userOperator: {}

    - name: Wait for Kafka cluster to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: kafka.strimzi.io/v1
        kind: Kafka
        name: market-data
        namespace: kafka
      register: kafka_status
      until:
        - kafka_status.resources | length > 0
        - kafka_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
      retries: 60
      delay: 15

    - name: Create market-data topic (6 partitions, 3-replica, 1h retention)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaTopic
          metadata:
            name: market-data
            namespace: kafka
            labels:
              strimzi.io/cluster: market-data
          spec:
            partitions: 6
            replicas: 3
            config:
              retention.ms: 3600000
              cleanup.policy: delete
              min.insync.replicas: 2

    - name: Create arbitration-decisions topic (1 partition, 3-replica)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaTopic
          metadata:
            name: arbitration-decisions
            namespace: kafka
            labels:
              strimzi.io/cluster: market-data
          spec:
            partitions: 1
            replicas: 3
            config:
              retention.ms: 3600000
              cleanup.policy: delete
              min.insync.replicas: 2

    - name: Wait for both topics to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: kafka.strimzi.io/v1
        kind: KafkaTopic
        namespace: kafka
        name: "{{ item }}"
      register: topic_status
      until:
        - topic_status.resources | length > 0
        - topic_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
      retries: 20
      delay: 10
      loop:
        - market-data
        - arbitration-decisions

    - name: Report deployment status
      ansible.builtin.debug:
        msg: "3-broker Kafka cluster with ISR and Strimzi-managed PDB is Ready. Topics 'market-data' and 'arbitration-decisions' are Ready with replication factor 3."
