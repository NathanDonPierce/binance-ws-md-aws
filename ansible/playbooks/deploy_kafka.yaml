---
- name: Deploy single-broker Kafka via Strimzi
  hosts: localhost
  connection: local
  gather_facts: false
 
  vars:
    kubeconfig_dir: "{{ playbook_dir | dirname }}/kubeconfig"
    kubeconfig_path: "{{ query('ansible.builtin.fileglob', kubeconfig_dir + '/*.yaml') | first }}"
 
  tasks:
    - name: Define the Kafka broker node pool (1 broker, ephemeral storage, on kafka nodes)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: kafka
            labels:
              strimzi.io/cluster: market-data
          spec:
            replicas: 1
            roles:
              - controller
              - broker
            storage:
              type: ephemeral
            resources:
              requests:
                memory: 1Gi
                cpu: 250m
              limits:
                memory: 2Gi
            template:
              pod:
                tolerations:
                  - key: role
                    operator: Equal
                    value: kafka
                    effect: NoSchedule
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: role
                              operator: In
                              values:
                                - kafka
 
    - name: Define the Kafka cluster (KRaft mode, one plain listener on 9092)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: Kafka
          metadata:
            name: market-data
            namespace: kafka
            annotations:
              strimzi.io/node-pools: enabled
              strimzi.io/kraft: enabled
          spec:
            kafka:
              listeners:
                - name: plain
                  port: 9092
                  type: internal
                  tls: false
              config:
                offsets.topic.replication.factor: 1
                transaction.state.log.replication.factor: 1
                transaction.state.log.min.isr: 1
                default.replication.factor: 1
                min.insync.replicas: 1
            entityOperator:
              topicOperator: {}
              userOperator: {}
 
    - name: Wait for Kafka cluster to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: kafka.strimzi.io/v1
        kind: Kafka
        name: market-data
        namespace: kafka
      register: kafka_status
      until:
        - kafka_status.resources | length > 0
        - kafka_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
      retries: 40
      delay: 15
 
    - name: Create market-data topic (listener output, 6 partitions, 1h retention)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaTopic
          metadata:
            name: market-data
            namespace: kafka
            labels:
              strimzi.io/cluster: market-data
          spec:
            partitions: 6
            replicas: 1
            config:
              retention.ms: 3600000
              cleanup.policy: delete
              min.insync.replicas: 1   
 
    - name: Create arbitration-decisions topic (reaper input, 1 partition)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: kafka.strimzi.io/v1
          kind: KafkaTopic
          metadata:
            name: arbitration-decisions
            namespace: kafka
            labels:
              strimzi.io/cluster: market-data
          spec:
            partitions: 1
            replicas: 1
            config:
              retention.ms: 3600000
              cleanup.policy: delete
              min.insync.replicas: 1
 
    - name: Wait for both topics to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: kafka.strimzi.io/v1
        kind: KafkaTopic
        namespace: kafka
        name: "{{ item }}"
      register: topic_status
      until:
        - topic_status.resources | length > 0
        - topic_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
      retries: 20
      delay: 10
      loop:
        - market-data
        - arbitration-decisions
 
    - name: Report deployment status
      ansible.builtin.debug:
        msg: "Kafka cluster 'market-data' and topics 'market-data' and 'arbitration-decisions' are Ready."
 
