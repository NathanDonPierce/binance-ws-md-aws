---
- name: Install Strimzi Kafka operator on the cluster
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kubeconfig_path: "{{ (lookup('ansible.builtin.fileglob', playbook_dir + '/../kubeconfig/*.yaml', wantlist=True) | first) | default('', true) }}"

  tasks:
    - name: Ensure the kubernetes.core collection is installed
      ansible.builtin.command: ansible-galaxy collection install kubernetes.core
      register: collection_install
      changed_when: "'was installed successfully' in collection_install.stdout"

    - name: Ensure Python kubernetes client is present
      ansible.builtin.pip:
        name: kubernetes
        state: present
        extra_args: --user

    - name: Add Strimzi Helm repository
      kubernetes.core.helm_repository:
        name: strimzi
        repo_url: https://strimzi.io/charts/

    - name: Install Strimzi operator into the kafka namespace
      kubernetes.core.helm:
        name: strimzi-kafka-operator
        chart_ref: strimzi/strimzi-kafka-operator
        release_namespace: kafka
        create_namespace: true
        wait: true
        wait_timeout: 5m
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Confirm the operator pod is running
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kafka
        label_selectors:
          - name=strimzi-cluster-operator
        kubeconfig: "{{ kubeconfig_path }}"
      register: operator_pods
      until: operator_pods.resources | length > 0 and operator_pods.resources[0].status.phase == "Running"
      retries: 30
      delay: 10

    - name: Report operator status
      ansible.builtin.debug:
        msg: "Strimzi operator is running: {{ operator_pods.resources[0].metadata.name }}"


